{% extends 'base.html' %}{% block content %}<h1>Your cart</h1>{% if items %}<table><tr><th>Product</th><th>Quantity</th><th>Subtotal</th></tr>{% for product, quantity, subtotal in items %}<tr><td>{{ product.name }}</td><td>{{ quantity }}</td><td>{{ subtotal|currency }}</td></tr>{% endfor %}</table><p><strong>Total: {{ total|currency }}</strong></p><form method="post" action="{{ url_for('checkout') }}"><label>Email <input type="email" name="email" required></label><button>Place order</button></form>{% else %}<p>Your cart is empty.</p>{% endif %}{% endblock %}
