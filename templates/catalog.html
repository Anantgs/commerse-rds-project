{% extends 'base.html' %}{% block content %}<h1>Catalog</h1><section class="products">{% for product in products %}<article><h2>{{ product.name }}</h2><p>{{ product.description }}</p><strong>{{ product.price|currency }}</strong><p>In stock: {{ product.inventory.quantity }}</p><form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button {% if not product.inventory.quantity %}disabled{% endif %}>Add to cart</button></form></article>{% endfor %}</section>{% endblock %}
